<main class="wrap narrow wide"><form class="card form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>{{ cfg.title }}</h2>
  @if (ok()) { <div class="note ok">{{ cfg.done }} <a routerLink="{{ kind === 'member' ? '/login' : '/partner/login' }}">Go to login</a></div> }
  @else {
  <div class="grid">
    @for (fl of cfg.fields; track fl.name) {
      <label [class.full]="fl.full">{{ fl.label }}{{ fl.optional ? '' : ' *' }}
        @if (fl.type === 'select') { <select [formControlName]="fl.name"><option value="">Select…</option>@for (o of fl.options; track o.value) { <option [value]="o.value">{{ o.label }}</option> }</select> }
        @else { <input [type]="fl.type" [formControlName]="fl.name" [attr.autocomplete]="fl.type === 'password' ? 'new-password' : null"> }
        @if (bad(fl.name)) { <small class="err">{{ fl.hint || 'Please enter a valid value' }}</small> }
      </label>
    }
  </div>
  @if (form.errors?.['mismatch'] && form.get('confirmPassword')?.touched) { <small class="err">Passwords do not match</small> }
  @if (cfg.checks) {
    <label class="chk"><input type="checkbox" formControlName="acceptTerms"> I accept the Terms and Conditions</label>
    <label class="chk"><input type="checkbox" formControlName="acceptPrivacy"> I accept the Privacy Policy</label>
  }
  @if (err()) { <div class="note err">{{ err() }}</div> }
  <button class="btn-blue" [disabled]="busy()">{{ busy() ? 'Submitting…' : 'Register' }}</button> }
</form></main>
