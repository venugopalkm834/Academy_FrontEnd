<main class="wrap narrow"><form class="card form" [formGroup]="f" (ngSubmit)="go()">
  <h2>{{ role === 'MEMBER' ? 'Member' : role === 'PARTNER' ? 'Academy' : 'Admin' }} Login</h2>
  <label>Mobile number<input type="tel" inputmode="numeric" maxlength="14" formControlName="mobile" autocomplete="tel" placeholder="10-digit mobile number">
      @if (invalid('mobile')) { <small class="err">Enter a valid 10-digit mobile number (starts with 6, 7, 8 or 9)</small> }</label>
  <label>Password<input type="password" formControlName="password" autocomplete="current-password">
      @if (invalid('password')) { <small class="err">Enter your password</small> }</label>
  @if (err()) { <div class="note err">{{ err() }}</div> }
  <button class="btn-blue" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Login' }}</button>
  <p class="links"><a routerLink="/forgot-password">Forgot password?</a>
    @if (role === 'MEMBER') { <a routerLink="/member/register">Create member account</a> }
    @if (role === 'PARTNER') { <a routerLink="/partner/register">Register your academy</a> }</p>
</form></main>
