<h1 class="page-title">My Profile</h1>
@if (info(); as i) {
  <form class="card form" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="top">
      <div class="preview">@if (photo()) { <img [src]="photo()" alt="Your photo"> } @else { <span>👤</span> }</div>
      <div><label class="btn-sm ghost file">📷 Change photo<input type="file" accept="image/*" capture="user" (change)="onPhoto($event)" hidden></label>
        <p class="small muted">Mobile: <b>{{ i.phone }}</b> · Email: <b>{{ i.email }}</b><br>Aadhaar: <b>{{ i.aadhaarMasked || 'not provided' }}</b></p></div>
    </div>
    <div class="grid">
      <label class="full">Full name *<input formControlName="fullName">@if (bad('fullName')) { <small class="err">Enter your full name</small> }</label>
      <label>I am a<select formControlName="memberType"><option value="STUDENT">Student</option><option value="PARENT">Parent</option></select></label>
      <label>Gender *<select formControlName="gender"><option value="">Select…</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select></label>
      <label>Date of birth *<input type="date" formControlName="dob" [max]="today"></label>
      <label>Education level *<select formControlName="educationLevel">@for (l of levels; track l.value) { <option [value]="l.value">{{ l.label }}</option> }</select></label>
      <label class="full">Full address *<textarea rows="2" formControlName="address"></textarea></label>
      <label>State *<select formControlName="state"><option value="">Select…</option>@for (s of states; track s) { <option [value]="s">{{ s }}</option> }</select></label>
      <label>District *<input formControlName="district"></label>
      <label>City *<input formControlName="city"></label>
      <label>PIN code *<input inputmode="numeric" maxlength="6" formControlName="pin">@if (bad('pin')) { <small class="err">Enter a valid 6-digit PIN code</small> }</label>
      <label class="full">School / college<input formControlName="school"></label>
    </div>
    @if (msg()) { <div class="note ok">{{ msg() }}</div> } @if (err()) { <div class="note err">{{ err() }}</div> }
    <button class="btn-blue" [disabled]="busy()">{{ busy() ? 'Saving…' : 'Save changes' }}</button>
  </form>
} @else if (err()) { <div class="note err">{{ err() }}</div> }
