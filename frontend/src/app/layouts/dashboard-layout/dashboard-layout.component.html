<div class="dash">
  <aside class="side" [class.open]="open">
    <a routerLink="/" class="logo light"><span class="logo-mark">📖</span><b>The Academic Club</b></a>
    <small class="role">{{ role }} PANEL</small>
    @for (m of menu; track m.path) { <a [routerLink]="m.path" routerLinkActive="active" (click)="open = false">{{ m.label }}</a> }
  </aside>
  <section class="main">
    <div class="dtop"><button class="burger dark" (click)="open = !open">☰</button><span class="grow"></span>
      <span class="who">{{ auth.user()?.firstName }}</span><button class="btn-blue sm" (click)="auth.logout()">Logout</button></div>
    <div class="dbody"><router-outlet /></div>
  </section>
</div>
