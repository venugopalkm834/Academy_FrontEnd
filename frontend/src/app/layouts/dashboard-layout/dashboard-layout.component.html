<div class="dash">
  <aside class="side" [class.open]="open">
    <a routerLink="/" class="logo light"><img class="logo-img on-dark" src="/logo.png" alt="The Academic Club logo"><b>The Academic Club</b></a>
    <small class="role">{{ roleName }} PANEL</small>
    @for (m of menu; track m.path) { <a [routerLink]="m.path" routerLinkActive="active" (click)="open = false"><span class="ic">{{ m.icon }}</span>{{ m.label }}</a> }
    <button type="button" class="out" (click)="auth.logout()">⏻ Logout</button>
    <small class="verside">v{{ version }}</small>
  </aside>
  @if (open) { <div class="scrim" (click)="open = false"></div> }
  <section class="main">
    <div class="dtop">
      <button class="burger dark" type="button" (click)="open = !open" aria-label="Menu">☰</button>
      <a routerLink="/" class="home-link">The Academic Club</a><span class="grow"></span>
      <ac-notification-bell />
      <span class="who">{{ auth.user()?.firstName }}</span><button class="btn-blue sm" type="button" (click)="auth.logout()">Logout</button>
    </div>
    <div class="dbody"><router-outlet /></div>
  </section>
  <nav class="bottom" aria-label="Main menu">
    @for (m of bottom; track m.path) { <a [routerLink]="m.path" routerLinkActive="active"><span>{{ m.icon }}</span>{{ short(m) }}</a> }
    <button type="button" (click)="open = true"><span>☰</span>More</button>
  </nav>
  <ac-whatsapp-fab [lift]="true" />
</div>
