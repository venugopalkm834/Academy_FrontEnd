@if (ads().length) {
  <div class="strip">
    <div class="strip-head"><h3>⭐ Featured Sponsors</h3><a [routerLink]="base">View all →</a></div>
    <div class="track">
      @for (a of ads(); track a.id) {
        <a class="ad" [routerLink]="[base, a.institution.id]" [class.has-img]="a.imageUrl" [style.background-image]="a.imageUrl ? 'linear-gradient(#0a2a5599,#0a2a55cc), url(' + a.imageUrl + ')' : null">
          <span class="ad-logo">@if (a.institution.logoUrl) { <img [src]="a.institution.logoUrl" alt=""> } @else { <span>{{ icon(a.institution.type) }}</span> }</span>
          <b>{{ a.institution.name }}</b>
          <span class="ad-line">{{ a.headline }}</span>
          <small>📍 {{ a.institution.city }} · View offers →</small>
        </a>
      }
    </div>
  </div>
}
