# Optional: deploy automatically every time you push to the main branch.
# In GitHub: Settings > Secrets and variables > Actions, add  SERVER_HOST, SERVER_USER, SERVER_SSH_KEY  (a private key that can log in to your server).
name: Deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/academic-club
            git pull origin main
            docker compose up -d --build
            docker image prune -f
